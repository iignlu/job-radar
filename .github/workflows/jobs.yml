# The scheduled alert run.
#
# NO QUOTA MATHS ANY MORE, and that is the point. Every source this now uses —
# the ATS boards and your own LinkedIn alert mail — is free per request, so the
# number of slots below is limited only by politeness. JSearch, the one metered
# source, is off (config.ENABLE_JSEARCH): it supplied about 1% of postings and
# its ~200/month ceiling was the only reason this schedule was capped at three
# slots. Turn it back on and the cap returns; the flag and this cron are one
# decision, not two.
name: job-alerts

on:
  schedule:
    # 02:17, 04:17, 06:17, 08:17 and 10:17 UTC, Sunday–Thursday.
    # Saudi Arabia is UTC+3, so 05:17 to 13:17 local.
    #
    # Five slots, all in the first half of the day, for one reason: GitHub's
    # free scheduled runs are neither punctual nor reliable, and two different
    # 3-slot schedules both failed, in opposite ways.
    #
    #     hours 06/11/16   delays of 3.5-6.3h; the last slot landed 01:42 local
    #     hours 03/06/09   landed inside working hours, but 0-1 slots fired
    #
    # Measured 27 September - 6 October. Tuning three slots cannot fix this: a
    # single slot is a coin flip, and whichever hour it is given, it is either
    # dropped or late. Five slots is the fix — if GitHub drops half of them,
    # three still land, and the day is covered rather than resting on one run.
    #
    # Why they stop at 10:17 UTC: the worst delay observed is about 6.5 hours,
    # so the LAST slot can still arrive by roughly 16:47 local. Nothing here
    # can land at night, which is the failure that started all of this. Early
    # is harmless — a notification waits — while late is the whole problem.
    #
    # Minute :17 rather than :00 because minute 0 is the most contended minute
    # of the hour and queues longest.
    #
    # This costs nothing: see the note on quota above.
    - cron: "17 2,4,6,8,10 * * 0-4"

  # Manual runs can widen the window without touching config. Useful on a
  # Friday/Saturday, when "today" is legitimately empty because the Saudi
  # working week has not started — an empty run is indistinguishable from a
  # broken one until you look further back.
  workflow_dispatch:
    inputs:
      date_posted:
        description: "How far back to search (blank = config default)"
        type: choice
        default: ""
        options: ["", "today", "3days", "week", "month", "all"]
      limit:
        description: "Max messages this run (blank = config default)"
        type: string
        default: ""
      dump_linkedin:
        description: "Inspect LinkedIn alert emails instead of running (diagnostic)"
        type: boolean
        default: false
      check_chat:
        description: "Verify the bot can post to this chat/channel, e.g. @mychannel (diagnostic)"
        type: string
        default: ""
      say:
        description: "Post one message to the chat instead of running (Telegram HTML allowed)"
        type: string
        default: ""
      probe_jsearch:
        description: "Test JSearch parameters one at a time (diagnostic, ~5 requests)"
        type: boolean
        default: false
      probe_ats:
        description: "Re-probe the watchlist for live boards, ATS and Workday (diagnostic, free)"
        type: boolean
        default: false
      explain:
        description: "Why so few? Judge every posting on offer and group the verdicts (diagnostic)"
        type: boolean
        default: false

# Needed to commit seen.json back to the repository.
permissions:
  contents: write

concurrency:
  # seen.json is the bot's whole memory and it lives in git. Two runs racing
  # would have one clobber the other's state and re-send everything it lost.
  group: job-alerts
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No install step: the project is standard-library-only by design.

      - name: Run job-radar
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # LinkedIn job alerts, read from your own mailbox. Unset means the
          # source is skipped entirely — it is additive, never required.
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          # Empty on scheduled runs, so config.py stays the source of truth.
          DATE_POSTED: ${{ inputs.date_posted }}
          LIMIT: ${{ inputs.limit }}
          DUMP_LINKEDIN: ${{ inputs.dump_linkedin }}
          PROBE_JSEARCH: ${{ inputs.probe_jsearch }}
          CHECK_CHAT: ${{ inputs.check_chat }}
          SAY: ${{ inputs.say }}
          PROBE_ATS: ${{ inputs.probe_ats }}
          EXPLAIN: ${{ inputs.explain }}
        run: |
          set -euo pipefail

          # The board probes are standalone scripts rather than jobradar flags:
          # they answer "which watchlist companies have a board at all", which
          # is a question about the watchlist, not about a run. Both run
          # together so one dispatch gives the whole picture rather than half
          # of it. Costs nothing — every board is public and unauthenticated.
          if [ "${PROBE_ATS:-}" = "true" ]; then
            echo "running: python tools/probe_ats.py"
            python tools/probe_ats.py
            echo
            echo "running: python tools/probe_workday.py"
            python tools/probe_workday.py
            exit $?
          fi

          # --say takes free text, so it gets its own invocation with the value
          # quoted. The $args path below is deliberately unquoted for word
          # splitting, which would shred a message into one argument per word.
          if [ -n "${SAY:-}" ]; then
            echo "running: python -m jobradar --say <message>"
            python -m jobradar --say "$SAY"
            exit $?
          fi

          args=""
          [ "${EXPLAIN:-}" = "true" ] && args="--explain"
          [ "${DUMP_LINKEDIN:-}" = "true" ] && args="--dump-linkedin"
          [ "${PROBE_JSEARCH:-}" = "true" ] && args="--probe-jsearch"
          [ -n "${CHECK_CHAT:-}" ] && args="--check-chat $CHECK_CHAT"
          if [ -z "$args" ]; then
            [ -n "${DATE_POSTED:-}" ] && args="$args --date-posted $DATE_POSTED"
            [ -n "${LIMIT:-}" ] && args="$args --limit $LIMIT"
          fi
          echo "running: python -m jobradar $args"
          python -m jobradar $args

      # If the run above died, the bot cannot tell you — it died before the
      # part that sends messages. So the workflow tells you instead, with curl
      # rather than Python, so a syntax error or a crashed interpreter cannot
      # take the alarm down with it.
      #
      # Goes to TELEGRAM_ADMIN_CHAT_ID when set, so that pointing
      # TELEGRAM_CHAT_ID at a shared channel does not broadcast "run FAILED"
      # to everyone subscribed to it. Falls back to the main chat id, then to
      # the one cached in seen.json, so the alarm still works in exactly the
      # situation that caused the first outage.
      # Only for real alert runs. A diagnostic that reports a problem is doing
      # its job, not suffering an outage, and "run FAILED — no jobs were sent"
      # is actively misleading when nothing was meant to be sent.
      - name: Report failure to Telegram
        if: failure() && inputs.check_chat == '' && inputs.say == '' && inputs.probe_jsearch != true && inputs.probe_ats != true && inputs.explain != true && inputs.dump_linkedin != true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          CHAT="${TELEGRAM_ADMIN_CHAT_ID:-${TELEGRAM_CHAT_ID:-}}"
          if [ -z "$CHAT" ] && [ -f seen.json ]; then
            CHAT=$(python -c "import json;print(json.load(open('seen.json')).get('chat_id',''))" 2>/dev/null)
          fi
          if [ -z "${TELEGRAM_TOKEN:-}" ] || [ -z "$CHAT" ]; then
            echo "no Telegram credentials available - cannot report failure"
            exit 0
          fi
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT}" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=🔴 job-radar run FAILED — no jobs were sent this run. Nothing is lost: unsent matches are not marked seen and will arrive on the next successful run. Details: ${RUN_URL}" \
            >/dev/null
          echo "failure reported to Telegram"

      - name: Commit seen.json
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain seen.json)" ]; then
            echo "seen.json unchanged - nothing to commit"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen.json
          git commit -m "chore: update seen.json [skip ci]"

          # Another run may have pushed while this one was talking to the API.
          # --autostash keeps the rebase clean if anything else is dirty.
          git pull --rebase --autostash
          git push
